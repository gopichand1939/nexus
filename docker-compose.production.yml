services:
  edge:
    image: caddy:2.10-alpine
    ports: [80:80, 443:443, 443:443/udp]
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:?Set the domain in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
